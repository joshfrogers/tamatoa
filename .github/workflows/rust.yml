name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Catch RUSTSEC disclosures against an unchanged Cargo.lock.
  schedule:
    - cron: "37 6 * * 1" # Mondays ~06:37 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to commit SHAs, not mutable tags (supply-chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Native runners on all three platforms: this repo's Windows/macOS code
  # (raw NTFS access, registry profile lookup) was never compiled by CI
  # before - regressions there were invisible.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --verbose

  # The release matrix ships musl-msvc-mac binaries; verify on every PR that
  # all three targets still compile, instead of discovering drift at tag time.
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-gnu
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }}

  # Release builds differ from debug (no overflow checks, no debug_assert,
  # LTO): run the suite in release too so optimizer-visible bugs surface in
  # PRs, not in IR binaries.
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --release --locked

  audit:
    # Dependency advisories on every change, plus weekly re-check via schedule.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
