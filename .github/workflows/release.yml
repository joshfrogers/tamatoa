name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Build release binaries for the platforms Velociraptor-style orchestrators
  # deploy to. Linux is a fully static musl build so one artifact runs on any
  # glibc/musl host regardless of the runner's toolchain.
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: tamatoa
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tamatoa.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: tamatoa
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions pinned to commit SHAs, not mutable tags (supply-chain).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce tag matches crate version
        shell: bash
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $CRATE_VERSION"
            exit 1
          fi

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The artifact must actually start on its platform; a binary that only
      # links but cannot execute is not a release.
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czvf \
            dist/tamatoa-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath dist/tamatoa-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamatoa-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist/
          merge-multiple: true

      # Verifier's entry point: `sha256sum -c SHA256SUMS` against downloaded
      # binaries. Orchestrators pin these digests.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum tamatoa-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
