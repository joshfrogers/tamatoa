[package]
name = "tamatoa"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[dependencies]
log = "0.4.0"
env_logger = "0.8.4"
glob = "0.3.0"
envmnt = "*"
zip = "0.6.2"
ring = "0.16.20"
data-encoding = "2.3.2"
anyhow = "1.0"
time = { version = "0.3.9", features = ["formatting", "large-dates", "macros"], default-features = false }


[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-drives = "0.5.0"
ntfs = "0.2.0"